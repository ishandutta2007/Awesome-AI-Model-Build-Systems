<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#101b38"/>
      <stop offset="100%" stop-color="#070b14"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .bg { fill: url(#bgGrad); }
    .grid-line { stroke: rgba(99, 102, 241, 0.08); stroke-width: 1; }
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 42px; fill: #ffffff; letter-spacing: -0.5px; }
    .title-gradient { fill: url(#accentGrad); font-weight: 900; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 18px; fill: #94a3b8; }
    .tagline { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 14px; fill: #38bdf8; letter-spacing: 1.5px; text-transform: uppercase; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #e2e8f0; }

    @keyframes pulseOrb {
      0% { r: 5px; opacity: 0.3; }
      50% { r: 8px; opacity: 0.9; }
      100% { r: 5px; opacity: 0.3; }
    }
    @keyframes floatPath {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 80; }
    }
    @keyframes orbitFloat {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }
    .orbiting { animation: orbitFloat 5s ease-in-out infinite; }
    .p1 { animation: pulseOrb 3s ease-in-out infinite; }
    .p2 { animation: pulseOrb 4s ease-in-out infinite 1s; }
    .p3 { animation: pulseOrb 3.5s ease-in-out infinite 2s; }
    .stream-line { stroke: #6366f1; stroke-width: 2; stroke-dasharray: 6 14; stroke-opacity: 0.6; animation: floatPath 3s linear infinite; }
    .stream-line-fast { stroke: #38bdf8; stroke-width: 2; stroke-dasharray: 8 16; stroke-opacity: 0.7; animation: floatPath 2s linear infinite reverse; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" class="bg" />

  <!-- Background Grid Lines -->
  <g>
    <line x1="60" y1="0" x2="60" y2="360" class="grid-line" />
    <line x1="180" y1="0" x2="180" y2="360" class="grid-line" />
    <line x1="300" y1="0" x2="300" y2="360" class="grid-line" />
    <line x1="420" y1="0" x2="420" y2="360" class="grid-line" />
    <line x1="540" y1="0" x2="540" y2="360" class="grid-line" />
    <line x1="660" y1="0" x2="660" y2="360" class="grid-line" />
    <line x1="780" y1="0" x2="780" y2="360" class="grid-line" />
    <line x1="900" y1="0" x2="900" y2="360" class="grid-line" />
    <line x1="1020" y1="0" x2="1020" y2="360" class="grid-line" />
    <line x1="1140" y1="0" x2="1140" y2="360" class="grid-line" />
    
    <line x1="0" y1="60" x2="1200" y2="60" class="grid-line" />
    <line x1="0" y1="120" x2="1200" y2="120" class="grid-line" />
    <line x1="0" y1="180" x2="1200" y2="180" class="grid-line" />
    <line x1="0" y1="240" x2="1200" y2="240" class="grid-line" />
    <line x1="0" y1="300" x2="1200" y2="300" class="grid-line" />
  </g>

  <!-- Dynamic Glowing Pipeline Streams in Right Background (does not obstruct foreground text) -->
  <g class="orbiting" opacity="0.85">
    <path d="M 820 80 Q 940 40 1060 90 T 1140 190" fill="none" class="stream-line" />
    <path d="M 850 290 Q 970 320 1070 260 T 1130 140" fill="none" class="stream-line-fast" />
    <path d="M 770 180 C 860 120, 930 240, 1030 180 S 1120 120, 1160 210" fill="none" stroke="#ec4899" stroke-width="1.5" stroke-dasharray="4 10" stroke-opacity="0.4" />

    <!-- Architecture Nodes -->
    <g transform="translate(840, 75)">
      <rect width="110" height="36" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" filter="url(#glow)" />
      <circle cx="16" cy="18" r="5" fill="#38bdf8" class="p1" />
      <text x="30" y="22" class="badge-text">Training Pod</text>
    </g>

    <g transform="translate(1010, 140)">
      <rect width="130" height="36" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.5" filter="url(#glow)" />
      <circle cx="16" cy="18" r="5" fill="#a855f7" class="p2" />
      <text x="30" y="22" class="badge-text">GPU Orchestrator</text>
    </g>

    <g transform="translate(870, 245)">
      <rect width="120" height="36" rx="8" fill="#1e293b" stroke="#ec4899" stroke-width="1.5" filter="url(#glow)" />
      <circle cx="16" cy="18" r="5" fill="#ec4899" class="p3" />
      <text x="30" y="22" class="badge-text">Serving Engine</text>
    </g>
  </g>

  <!-- Foreground Content (Clear, Crisp, Unoccluded) -->
  <g transform="translate(70, 0)">
    <text x="0" y="90" class="tagline">⚡ Production AI Infrastructure &amp; Compute Stack</text>
    <text x="0" y="150" class="title">Awesome <tspan class="title-gradient">AI Model Build Systems</tspan></text>
    <text x="0" y="195" class="subtitle">Curated SaaS Platforms, GPU Orchestration &amp; Open-Source Distributed Frameworks</text>
    <text x="0" y="225" class="subtitle" font-size="15px" fill="#64748b">Train · Fine-Tune · Scale · Serve · Optimize GPU Utilization</text>

    <!-- Bottom Feature Pills in Foreground -->
    <g transform="translate(0, 265)">
      <rect x="0" y="0" width="170" height="32" rx="16" fill="rgba(99, 102, 241, 0.2)" stroke="rgba(99, 102, 241, 0.5)" />
      <text x="16" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12px" font-weight="600" fill="#a5b4fc">🚀 Distributed Training</text>

      <rect x="185" y="0" width="165" height="32" rx="16" fill="rgba(56, 189, 248, 0.2)" stroke="rgba(56, 189, 248, 0.5)" />
      <text x="201" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12px" font-weight="600" fill="#7dd3fc">⚡ GPU Orchestration</text>

      <rect x="365" y="0" width="160" height="32" rx="16" fill="rgba(168, 85, 247, 0.2)" stroke="rgba(168, 85, 247, 0.5)" />
      <text x="381" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12px" font-weight="600" fill="#d8b4fe">🌐 Low-Latency Serving</text>

      <rect x="540" y="0" width="145" height="32" rx="16" fill="rgba(236, 72, 153, 0.2)" stroke="rgba(236, 72, 153, 0.5)" />
      <text x="556" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12px" font-weight="600" fill="#f472b6">📊 MLOps &amp; Tracking</text>
    </g>
  </g>
</svg>
