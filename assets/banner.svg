<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="360" viewBox="0 0 1200 360"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#101b38"/><stop offset="100%" stop-color="#070b14"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#6366f1"/><stop offset="50%" stop-color="#a855f7"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="6"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulseOrb{0%{r:5px;opacity:.3}50%{r:8px;opacity:.9}}@keyframes floatPath{0%{stroke-dashoffset:0}}@keyframes orbitFloat{0%{transform:translateY(0)}50%{transform:translateY(-8px)}}.bg{fill:url(#bgGrad)}.grid-line{stroke:rgba(99,102,241,.08);stroke-width:1}.title{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif;font-weight:800;font-size:42px;fill:#fff;letter-spacing:-.5px}.title-gradient{fill:url(#accentGrad);font-weight:900}.badge-text,.subtitle,.tagline{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.subtitle{font-weight:400;font-size:18px;fill:#94a3b8}.badge-text,.tagline{font-weight:600}.tagline{font-size:14px;fill:#38bdf8;letter-spacing:1.5px;text-transform:uppercase}.badge-text{font-size:12px;fill:#e2e8f0}.orbiting{animation:orbitFloat 5s ease-in-out infinite}.p1{animation:pulseOrb 3s ease-in-out infinite}.p2{animation:pulseOrb 4s ease-in-out infinite 1s}.p3{animation:pulseOrb 3.5s ease-in-out infinite 2s}.stream-line{stroke:#6366f1;stroke-width:2;stroke-dasharray:6 14;stroke-opacity:.6;animation:floatPath 3s linear infinite}.stream-line-fast{stroke:#38bdf8;stroke-width:2;stroke-dasharray:8 16;stroke-opacity:.7;animation:floatPath 2s linear infinite reverse}</style>